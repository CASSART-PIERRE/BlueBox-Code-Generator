  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
      color: #0264B2;
    }

    .card {
      width: min(100%, 430px);
      padding: 32px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    .logo {
      display: block;
      width: 260px;
      max-width: 90%;
      height: auto;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 28px;
      color: #0264B2;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
      color: #0264B2;
    }

    input {
      width: 100%;
      height: 62px;
      padding: 10px;
      border: 2px solid #0264B2;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #0264B2;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 7px;
      text-align: center;
    }

    input:focus {
      box-shadow: 0 0 0 4px rgba(2, 100, 178, 0.14);
    }

    button {
      width: 100%;
      height: 56px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: #0264B2;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .error {
      min-height: 20px;
      margin-top: 10px;
      color: #c62828;
      font-size: 14px;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 22px;
      border-radius: 14px;
      background: #f2f7fb;
    }

    .result-label {
      font-size: 14px;
      font-weight: 700;
      color: #0264B2;
    }

    #output {
      margin-top: 8px;
      color: #0264B2;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 7px;
    }
  </style>

    <h1>Code Generator</h1>

    <label for="code">Enter 8-digit code</label>

    <input
      id="code"
      type="text"
      inputmode="numeric"
      maxlength="8"
      autocomplete="off"
      placeholder="00000000"
      aria-label="Enter 8-digit code"
    >

    <button id="generate" type="button">Generate</button>

    <div id="error" class="error" aria-live="polite"></div>

    <section id="result" class="result" aria-live="polite">
      <div class="result-label">Generated code</div>
      <div id="output">000000</div>
    </section>
  </main>

  <script>
    function incrementDigit(digit) {
      return String((Number(digit) + 1) % 10);
    }

    function generateCode(code) {
      const lastDigit = Number(code[5]);
      let transformed = code;

      if (lastDigit % 2 === 1) {
        transformed = [...code].reverse().join('');
      }

      return [...transformed].map(incrementDigit).join('');
    }

    function runGenerator() {
      const input = document.getElementById("code");
      const error = document.getElementById("error");
      const result = document.getElementById("result");
      const output = document.getElementById("output");

      const fullCode = input.value.trim();

      error.textContent = "";
      result.style.display = "none";

      if (!/^\d{8}$/.test(fullCode)) {
        error.textContent = "Please enter exactly 8 digits.";
        return;
      }

      // Only the last 6 digits are used.
      const code = fullCode.slice(-6);

      output.textContent = generateCode(code);
      result.style.display = "block";
    }

    document.getElementById("generate").addEventListener("click", runGenerator);

    document.getElementById("code").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 8);
    });

    document.getElementById("code").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        runGenerator();
      }
    });
  </script>
</body>
